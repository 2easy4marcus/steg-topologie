# Source manifest for the Evidence Model V2 canonical geography.
#
# Two top-level collections, mirroring app/data/models.py:
#   sources:   logical DatasetSource records (identity, ownership, policy)
#   artifacts: immutable SourceArtifact records (path, checksum, size),
#              each pointing back at a `sources:` entry via `source_id`.
#
# `retrieved_at` / `registered_at` below are LOCAL REGISTRATION timestamps
# (when this manifest entry was written), not proven original download
# dates -- see README.md. Every source is kept `private_research` until its
# original URL and license are independently verified, except the OSM
# extract, whose ODbL-1.0 license is already well-established.
#
# Verify with: python scripts/validate_sources.py docs/data/sources.yaml
# (real-file checksum verification only runs when STEG_SOURCE_ROOT is set).

sources:
  - source_id: tunisia-delegations
    title: Tunisia delegations administrative boundaries
    owner: unverified_local_copy
    geographic_coverage: Tunisia
    publication_class: private_research
    refresh_policy: manual
    schema_version: "1"
    acquisition_description: >-
      Locally held GeoJSON/TopoJSON pair of Tunisia's delegation-level
      administrative boundaries. Original publisher, acquisition date, and
      license are not yet independently verified.

  - source_id: tunisia-electoral-constituencies
    title: Tunisia electoral constituencies boundaries
    owner: unverified_local_copy
    geographic_coverage: Tunisia
    publication_class: private_research
    refresh_policy: excluded_from_model
    schema_version: "1"
    acquisition_description: >-
      Locally held GeoJSON of Tunisia's electoral constituency boundaries.
      Registered for provenance only -- not consumed by the canonical
      geography importer.

  - source_id: steg-service-units
    title: STEG districts and agencies directory
    owner: STEG
    geographic_coverage: Tunisia
    temporal_coverage: "2015"
    publication_class: private_research
    refresh_policy: manual
    schema_version: "1"
    acquisition_description: >-
      Locally held legacy .xls export listing STEG district/agency offices
      with contact numbers and, for some rows, coordinates.

  - source_id: blackout-report-2014
    title: Independent commission report extract on the 2014 blackout
    owner: independent_commission
    geographic_coverage: Tunisia
    temporal_coverage: "2014-08-31"
    publication_class: private_research
    refresh_policy: immutable
    schema_version: "1"
    acquisition_description: >-
      Extract of the independent commission's final report on the August
      2014 national blackout.

  - source_id: tunisia-boundary
    title: Tunisia national boundary
    owner: unverified_local_copy
    geographic_coverage: Tunisia
    publication_class: private_research
    refresh_policy: manual
    schema_version: "1"
    acquisition_description: >-
      Locally held GeoJSON of Tunisia's national boundary polygon.

  - source_id: osm-tunisia-20260725
    title: OpenStreetMap Tunisia PBF snapshot
    owner: OpenStreetMap contributors
    geographic_coverage: Tunisia
    temporal_coverage: "2026-07-25"
    license_id: ODbL-1.0
    publication_class: private_research
    refresh_policy: manual
    schema_version: "1"
    acquisition_description: >-
      Local PBF extract from OpenStreetMap covering Tunisia, dated
      2026-07-25.

artifacts:
  # Canonical geography artifact: the importer parses this one. 272
  # features, each with a globally-unique adm_id.
  - artifact_id: tunisia-delegations-geojson
    source_id: tunisia-delegations
