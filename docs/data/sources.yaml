    checksum_sha256: 52b3846c35131f108c0b403bd9241b737cd6cf013b8cfe9a036dc253a047afbb
    byte_size: 3225728
    retrieved_at: 2026-07-30T00:00:00Z
    registered_at: 2026-07-30T00:00:00Z
    media_type: application/geo+json
    schema_version: "1"

